services:
  bot:
    build: .
    container_name: wechatgpt-dual-bot
    command: ["python", "bot.py"]
    env_file: .env
    volumes:
      - ./knowledge_store:/app/knowledge_store
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      - redis

  webhook:
    build: .
    container_name: wechatgpt-dual-api
    command: ["uvicorn", "webhook:app", "--host", "0.0.0.0", "--port", "8900"]
    ports:
      - "8900:8900"
    env_file: .env
    volumes:
      - ./knowledge_store:/app/knowledge_store
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8900/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: wechatgpt-dual-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
